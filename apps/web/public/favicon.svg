<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#0B3D2E"/>
  <g transform="translate(5, 5) scale(0.55)">
    
    <defs>
      <!-- Top Forward Arrow Gradient: Neon Move Green to Rich Green -->
      <linearGradient id="topArrowGrad" x1="20%" y1="70%" x2="95%" y2="25%">
        <stop offset="0%" stop-color="#00D254"/>
        <stop offset="60%" stop-color="#24F01A"/>
        <stop offset="100%" stop-color="#39FF14"/>
      </linearGradient>

      <!-- 3D Ribbon Fold: Shadow and Depth -->
      <linearGradient id="ribbonFoldGrad" x1="100%" y1="20%" x2="20%" y2="80%">
        <stop offset="0%" stop-color="#06261C"/>
        <stop offset="45%" stop-color="#0B3D2E"/>
        <stop offset="80%" stop-color="#007A4D"/>
        <stop offset="100%" stop-color="#16DB2E"/>
      </linearGradient>

      <!-- Lower Loop of P: Forest Green curving to Electric Green -->
      <linearGradient id="bottomLoopGrad" x1="15%" y1="30%" x2="85%" y2="85%">
        <stop offset="0%" stop-color="#0E5A3F"/>
        <stop offset="40%" stop-color="#10AC36"/>
        <stop offset="80%" stop-color="#28E81E"/>
        <stop offset="100%" stop-color="#39FF14"/>
      </linearGradient>

      <!-- Ambient Drop/Fold Shadow for 3D realism -->
      <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="-1.5" dy="2.5" stdDeviation="2.5" flood-color="#041E15" flood-opacity="0.6"/>
      </filter>
    </defs>

    <g>
      <!-- 1. Bottom Loop (Lower curve of the P) -->
      <path d="M 22 56 C 22 76 34 92 52 92 C 67 92 80 82 89 68 C 93 62 89 54 80 57 C 69 66 56 73 45 66 C 36 60 36 47 43 35 L 24 35 C 22 41 22 48 22 56 Z"
            fill="url(#bottomLoopGrad)"/>

      <!-- 2. The 3D Underfold (Creates depth where loop twists under arrow) -->
      <path d="M 43 35 C 50 49 63 56 80 57 C 89 54 93 62 89 68 C 95 59 97 45 88 34 C 79 24 64 27 43 35 Z"
            fill="url(#ribbonFoldGrad)"/>

      <!-- 3. Top Forward Arrow (Hero forward-pointing chevron) with shadow -->
      <path d="M 24 35 C 31 21 46 10 64 10 C 78 10 90 17 98 27 C 103 33 100 41 91 45 C 80 50 71 44 62 35 C 50 23 38 25 30 31 Z"
            fill="url(#topArrowGrad)"
            filter="url(#foldShadow)"/>
    </g>
  
  </g>
</svg>